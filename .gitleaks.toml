# gitleaks configuration for cs-webinars.
#
# Extends gitleaks' built-in ruleset (so every default secret rule still
# runs) and adds a narrowly-scoped allowlist for values we have confirmed
# are safe to publish. Keep entries here specific to a single file path and
# documented. An over-broad allowlist quietly turns the scan off.
#
# When to add an entry, and how, is written up in
# docs/overriding-a-safe-secret-scan.md.

title = "cs-webinars gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = """
Throwaway self-signed TLS material generated for the Hardening Konnect lab.
The private key is regenerated by attendees when they run the lab; it grants
access to nothing and is published deliberately as sample material.
See docs/overriding-a-safe-secret-scan.md for the reasoning trail.
"""
paths = [
  '''^webinars/2026-07-hardening-konnect/00-base/cert/tls\.(key|cert)$''',
]

[[allowlists]]
description = """
Throwaway demo API key ("demo-secret-key-123") used in curl examples for the
AI and APIs webinar README. It authenticates nothing real -- localhost only,
walkthrough material -- and was flagged by gitleaks in this PR's commit
history. See docs/overriding-a-safe-secret-scan.md for the reasoning trail.
"""
paths = [
  '''^webinars/2026-07-ai-and-apis/demo/README\.md$''',
]
regexes = [
  '''demo-secret-key-123''',
]

[[allowlists]]
description = """
Placeholder API key ("webinar-secret-key-123") for a Kong key-auth consumer
that the AI Cost Optimization webinar's own deck.yaml creates on the
attendee's locally-run Kong Gateway. It authenticates nothing external and
was already superseded by __REPLACE_ME__ in the current file, but the
original value still landed in this PR's commit history. See
docs/overriding-a-safe-secret-scan.md for the reasoning trail.
"""
paths = [
  '''^webinars/2026-08-ai-cost-optimization/\.env\.example$''',
]
regexes = [
  '''webinar-secret-key-123''',
]