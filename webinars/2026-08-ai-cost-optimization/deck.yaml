_format_version: "3.0"

consumers:
  - username: webinar-consumer
    keyauth_credentials:
      - key: ${{ env "DECK_WEBINAR_API_KEY" }}

services:
  - name: ai-cost-optimization-service
    url: https://api.openai.com
    routes:
      # ------------------------------------------------------------------------
      # Route 1: Semantic Caching Demo
      # ------------------------------------------------------------------------
      - name: 01-semantic-cache-route
        paths:
          - /semantic-cache
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: ai-semantic-cache
            config:
              embeddings:
                auth:
                  header_name: Authorization
                  header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                model:
                  provider: openai
                  name: text-embedding-3-small
                  options:
                    upstream_url: https://api.openai.com/v1/embeddings
              vectordb:
                strategy: redis
                dimensions: 1536
                threshold: 0.3
                distance_metric: cosine
                redis:
                  host: ${{ env "DECK_REDIS_HOST" }}
                  port: ${{ env "DECK_REDIS_PORT" }}
          - name: ai-proxy-advanced
            config:
              targets:
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o-mini
                    options:
                      max_tokens: 1024
                      input_cost: 0.15
                      output_cost: 0.60

      # ------------------------------------------------------------------------
      # Route 2: Semantic Routing Demo
      # ------------------------------------------------------------------------
      - name: 02-proxy-advanced-route
        paths:
          - /proxy-advanced
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: ai-proxy-advanced
            config:
              embeddings:
                auth:
                  header_name: Authorization
                  header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                model:
                  provider: openai
                  name: text-embedding-3-small
                  options:
                    upstream_url: https://api.openai.com/v1/embeddings
              vectordb:
                strategy: redis
                dimensions: 1536
                threshold: 1
                distance_metric: cosine
                redis:
                  host: ${{ env "DECK_REDIS_HOST" }}
                  port: ${{ env "DECK_REDIS_PORT" }}
              balancer:
                algorithm: semantic
              targets:
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o-mini
                    options:
                      max_tokens: 1024
                      input_cost: 0.15
                      output_cost: 0.60
                  description: "Use this target for simple, routine, conversational questions, general knowledge, greetings, and basic text formatting."
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o
                    options:
                      max_tokens: 1024
                      input_cost: 2.50
                      output_cost: 10.00
                  description: "Use this target for advanced, complex tasks requiring deep reasoning, mathematics, logic puzzles, coding, computer science, and software engineering."

      # ------------------------------------------------------------------------
      # Route 3: Model-Based Routing - Classifier Endpoint (Internal, No Auth)
      # ------------------------------------------------------------------------
      - name: 03-model-selector-route
        paths:
          - /model-selection
        strip_path: true
        plugins:
          - name: ai-prompt-decorator
            config:
              llm_format: openai
              prompts:
                prepend:
                  - role: system
                    content: >
                      You are an intelligent model router. Analyze the user's prompt and recommend the most
                      appropriate model for the task. Return ONLY ONE of these exact strings,
                      nothing else: "gpt-4o-mini" for simple tasks, or "gpt-4o" for complex tasks requiring deeper reasoning.
          - name: ai-proxy-advanced
            config:
              response_streaming: deny
              targets:
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o-mini
                    options:
                      input_cost: 0.15
                      output_cost: 0.60

      # ------------------------------------------------------------------------
      # Route 3: Model-Based Routing - Orchestration Endpoint (Authenticated)
      # ------------------------------------------------------------------------
      - name: 03-model-routing-route
        paths:
          - /model-routing
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: datakit
            config:
              nodes:
                - { name: EXTRACT_PROMPT, type: jq, input: request.body, jq: '({"messages": .messages})' }
                - { name: CALL_MODEL_SELECTOR, type: call, url: "http://localhost:8000/model-selection",
                    method: POST, inputs: { body: EXTRACT_PROMPT } }
                - { name: EXTRACT_MODEL, type: jq, inputs: { body: CALL_MODEL_SELECTOR.body },
                    jq: '.body.choices[0].message.content | gsub("^\\s+|\\s+$"; "")' }
                - { name: UPDATE_REQUEST, type: jq, inputs: { original: request.body, selected: EXTRACT_MODEL },
                    output: service_request.body, jq: '.original + {model: .selected}' }
          - name: ai-proxy-advanced
            config:
              response_streaming: allow
              targets:
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o-mini
                    model_alias: gpt-4o-mini
                    options:
                      input_cost: 0.15
                      output_cost: 0.60
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o
                    model_alias: gpt-4o
                    options:
                      input_cost: 2.50
                      output_cost: 10.00

      # ------------------------------------------------------------------------
      # Route 4: Prompt Compression Demo (Authenticated)
      # ------------------------------------------------------------------------
      - name: 04-prompt-compressor-route
        paths:
          - /prompt-compressor
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: post-function
            config:
              header_filter:
                - |
                  local ctx = ngx.ctx.ai_namespaced_ctx
                  if ctx then
                    local results = ctx["compress-request"] and ctx["compress-request"]["compressor_results"]
                    if results and results[1] then
                      local r = results[1]
                      kong.response.set_header("X-AI-Compressor-Original-Tokens", tostring(r.original_token_count))
                      kong.response.set_header("X-AI-Compressor-Compressed-Tokens", tostring(r.compress_token_count))
                      kong.response.set_header("X-AI-Compressor-Saved-Tokens", tostring(r.save_token_count))
                      kong.response.set_header("X-AI-Compressor-Ratio", string.format("%.2f", r.compress_value))
                    end
                  end
          - name: ai-prompt-compressor
            config:
              compressor_type: rate
              compressor_url: ${{ env "DECK_COMPRESSOR_URL" }}
              compression_ranges:
                - min_tokens: 20
                  max_tokens: 100
                  value: 0.8
                - min_tokens: 100
                  max_tokens: 1000000
                  value: 0.3
          - name: ai-proxy-advanced
            config:
              targets:
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o-mini
                    options:
                      max_tokens: 1024
                      input_cost: 0.15
                      output_cost: 0.60

      # ------------------------------------------------------------------------
      # Route 5: Token & Cost-Based Rate Limiting Demo (Authenticated)
      # ------------------------------------------------------------------------
      - name: 05-rate-limiting-advanced-route
        paths:
          - /rate-limiting-advanced
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: ai-rate-limiting-advanced
            config:
              tokens_count_strategy: cost
              hide_client_headers: false
              llm_providers:
                - name: openai
                  limit:
                    - 0.00001  # Ultra-small cost budget (one-hundredth of a cent!)
                  window_size:
                    - 60  # 60 second window
          - name: ai-proxy-advanced
            config:
              targets:
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o-mini
                    options:
                      max_tokens: 1024
                      input_cost: 0.15
                      output_cost: 0.60

      # ------------------------------------------------------------------------
      # Route 6: LLM-as-a-Judge Quality Scoring Demo (Authenticated)
      # ------------------------------------------------------------------------
      - name: 06-llm-as-judge-route
        paths:
          - /llm-as-judge
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
          - name: post-function
            config:
              body_filter:
                - |
                  local metrics = ngx.ctx.ai_llm_metrics
                  if metrics and metrics.llm_accuracy then
                    kong.log.set_serialize_value("ai-llm-as-judge", { accuracy = metrics.llm_accuracy })
                  end
          - name: file-log
            config:
              path: /tmp/file.log
              reopen: true
          - name: ai-llm-as-judge
            config:
              prompt: |
                You are a strict, objective AI auditor. Evaluate the answer's correctness and formatting.
                Return a single numeric score between 1 and 100 representing accuracy. Do NOT output any explanations, tags, or text.
              sampling_rate: 1
              llm:
                auth:
                  header_name: Authorization
                  header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                model:
                  provider: openai
                  name: gpt-4o-mini
                  options:
                    temperature: 1
                    max_tokens: 5
                route_type: llm/v1/chat
          - name: ai-proxy-advanced
            config:
              targets:
                - route_type: llm/v1/chat
                  logging:
                    log_statistics: true
                    log_payloads: true
                  auth:
                    header_name: Authorization
                    header_value: Bearer ${{ env "DECK_OPENAI_API_KEY" }}
                  model:
                    provider: openai
                    name: gpt-4o-mini
                    options:
                      max_tokens: 1024
                      input_cost: 0.15
                      output_cost: 0.60
