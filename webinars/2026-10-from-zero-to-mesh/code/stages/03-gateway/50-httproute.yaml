# The only route: GET / to the demo app. Nothing under /admin is routed.
# The route lives in the demo namespace so it can name the demo Service without a ReferenceGrant.
# Stage 07 swaps this file for patches/50-httproute-mzsvc.yaml and back.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-app
  namespace: demo
spec:
  parentRefs:
    - name: demo-gateway
      namespace: kong
      sectionName: http
    - name: demo-gateway
      namespace: kong
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /
          method: GET
      backendRefs:
        - name: demo-app
          port: 80
