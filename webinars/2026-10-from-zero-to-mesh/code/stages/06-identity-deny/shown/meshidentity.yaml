# Reference copy, not applied by apply.sh: applied by Terraform before any zone joined, so every
# workload already has an identity when the webinar starts. apply.sh only checks it exists.
# Read-only copy. Issuing identity to workloads turns on mTLS, and with mTLS on,
# traffic is denied until a MeshTrafficPermission allows it.
#   selector      every data plane proxy in the mesh gets an identity
#   spiffeID      the name in the certificate: trust domain, namespace and ServiceAccount.
#                 One ServiceAccount, one identity. This is what an allow rule names.
#   provider      Bundled: the control plane issues the certificates from an autogenerated CA
#   meshTrustCreation  Enabled: the control plane also creates the MeshTrust for that CA
# MeshIdentity needs meshServices.mode: Exclusive on the Mesh. The Kong docs label MeshIdentity experimental.
# Docs: https://developer.konghq.com/mesh/issue-identity-with-meshidentity/ and
#       https://developer.konghq.com/mesh/policies/meshidentity/
apiVersion: kuma.io/v1alpha1
kind: MeshIdentity
metadata:
  name: identity
  namespace: kong-mesh-system
  labels:
    kuma.io/mesh: ${MESH_NAME}
spec:
  selector:
    dataplane:
      matchLabels: {}
  spiffeID:
    trustDomain: '{{ .Mesh }}.{{ .Zone }}.mesh.local'
    path: '/ns/{{ .Namespace }}/sa/{{ .ServiceAccount }}'
  provider:
    type: Bundled
    bundled:
      meshTrustCreation: Enabled
      insecureAllowSelfSigned: true
      certificateParameters:
        expiry: 24h
      autogenerate:
        enabled: true
