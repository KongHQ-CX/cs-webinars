_defaults:
  kongctl:
    namespace: aigw-migration-models
ai_gateway_models:
  - ref: anthropic-messages
    type: model
    display_name: anthropic-messages
    name: anthropic-messages
    capabilities:
      - generate
    formats:
      - type: anthropic
    targets:
      - name: us.anthropic.claude-haiku-4-5-20251001-v1:0
        weight: 100
        allow_auth_override: false
        provider: bedrock-1
        config:
          embeddings_normalize: false
          region: us-east-1
          type: bedrock
    access:
      auth_strategies:
        - api-key
    config:
      route:
        paths:
          - /anthropic
        protocols:
          - http
          - https
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        model:
          body_param: model
          values:
            - us.anthropic.claude-haiku-4-5-20251001-v1:0
      logging:
        payloads: false
      response_streaming: allow
      max_request_body_size: 8192
      model:
        name_header: true
      balancer:
        algorithm: round-robin
        connect_timeout: 60000
        fail_timeout: 10000
        failover_criteria:
          - error
          - timeout
        max_fails: 0
        read_timeout: 60000
        retries: 5
        slots: 10000
        write_timeout: 60000
    ai_gateway: !ref aigw-migration-23#id
